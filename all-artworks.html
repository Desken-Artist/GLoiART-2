  <main>

      <a class="back-link" href="index.html#gallery" data-i18n="backGallery">← Back to gallery</a>
      <p class="eyebrow" data-i18n="allCollection">The complete collection</p>
      <h1 data-i18n="allArtworks">All Artworks</h1>
      <p data-i18n="allIntro">Explore every artwork currently uploaded to the GLoiART collection.</p>
    </section>
    <section class="section gallery-section all-artworks-section">
      <div id="allGalleryGrid" class="gallery-grid"></div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded",()=>{
      const g=document.getElementById("allGalleryGrid");
      if(g){
        g.replaceChildren();
        if(ARTWORKS.length){
          g.append(...ARTWORKS.map(createArtworkCard));
        } else {
          const empty=document.createElement("p");
          empty.className="no-artwork-message";
          empty.textContent=tr("noArtwork");
          g.appendChild(empty);
        }
      }
    });
  </script>
</body>
<script>document.addEventListener("DOMContentLoaded",initLanguage);</script>
