<script>
document.addEventListener("DOMContentLoaded",()=>{
 const toggle=document.getElementById("menuToggle"),nav=document.getElementById("mainNav");
 if(toggle&&nav){
  toggle.addEventListener("click",()=>{
   const open=nav.classList.toggle("open");
   toggle.classList.toggle("open",open);
   toggle.setAttribute("aria-expanded",String(open));
   toggle.setAttribute("aria-label",open?"Close navigation menu":"Open navigation menu");
  });
  nav.querySelectorAll("a[href^='index.html#']").forEach(a=>a.addEventListener("click",()=>{
   nav.classList.remove("open");toggle.classList.remove("open");toggle.setAttribute("aria-expanded","false");
  }));
 }
});
